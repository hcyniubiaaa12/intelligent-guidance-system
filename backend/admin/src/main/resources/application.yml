server:
  port: 8080

spring:
  application:
    name: guide-system
  profiles:
    active: local
  # 上传上限必须显式配：Spring Boot 默认 max-file-size=1MB / max-request-size=10MB，
  # 一份带插图的科室文档（2–5MB 很常见）会被直接拒掉，而且这个拒绝发生在 controller **之前**。
  # 超限由 GlobalExceptionHandler 接成统一返回体（不接的话管理员看到一个跟本系统无关的错误页）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # 提示词外置（导诊/改写/话术），改提示词不用改代码；缺文件或占位符丢失会启动失败
  config:
    import: classpath:prompts.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/guide?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:192.168.193.131}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.193.131:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:guide}

# 向量库（PostgreSQL + pgvector）——管语义，独立于上面 MySQL 主数据源；
# 写入方：kb（RAG 语料）与 feedback（聚类锚点，见数据库设计 4.1）
pgvector:
  url: jdbc:postgresql://${PGVECTOR_HOST:192.168.193.131}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:guide_vec}
  username: ${PGVECTOR_USER:postgres}
  password: ${PGVECTOR_PASSWORD:}
  # 与阿里 text-embedding-v3 对齐；换 embedding 模型需同步改维度并重建向量
  dimension: ${PGVECTOR_DIM:1024}

# Elasticsearch——chunk 全文检索（BM25）+ 医疗术语聚合；写入方：kb（唯一写入口）
elasticsearch:
  uris: ${ES_URIS:http://192.168.193.131:9200}
  username: ${ES_USERNAME:}
  password: ${ES_PASSWORD:}
  chunk-index: ${ES_CHUNK_INDEX:guide_chunk}

# 日志：链路 A 各阶段（入口校验/规则门槛/双路召回/RRF/精排/模型生成/结论解析/落库）打 INFO，
# 一行一个关键数据（条数、分数、置信度、耗时），并按轮次标记 [sXXXXXX-rN] 归组，顺着一次导诊看得清顺序；
# 需要更细的模型请求与召回明细时把 com.guide.rag / com.guide.llm 调成 DEBUG
logging:
  level:
    com.guide: INFO
    # com.guide.rag: DEBUG   # 逐条召回明细、Prompt 组装、模型原始输出
    # com.guide.llm: DEBUG   # 模型请求/响应摘要（模型名、条数、耗时、重排分数）
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-34.34logger{34} [%X{turn:-}] %msg%n"
  file:
    name: logs/guide.log

# 演示种子数据（开发夹具）：默认开启，启动时装载 7 科室语料 + 术语白名单（科室表非空即跳过，幂等）
# 它是科室/语料的唯一默认来源——关掉且尚未走链路 B 上传流水线时，挂号页会无科室可选
# 链路 B 上传流水线就绪后置 false
guide:
  seed:
    enabled: ${GUIDE_SEED_ENABLED:true}
  # 离线入库（链路 B）：扫描节拍固定，轮询间隔与解析总超时走 sys_config（运行时可调）
  ingest:
    scan-interval-ms: ${GUIDE_INGEST_SCAN_MS:5000}

mybatis-plus:
  # 枚举包：@EnumValue 标注的编码字段自动装载（见《数据库设计.md》§0）
  type-enums-package: com.guide.auth.enums,com.guide.chat.enums,com.guide.kb.enums,com.guide.feedback.enums,com.guide.async.enums
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 真实密钥放 application-local.yml（不提交），此处只用占位符
# JWT（链路 D）：secret 为 HS256 密钥（至少 32 字符）；登录态存 Redis，登出/过期即时失效
jwt:
  secret: ${JWT_SECRET:}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
  redis-key-prefix: ${JWT_REDIS_KEY_PREFIX:auth:token:}

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-v3}
    rerank-model: ${RERANK_MODEL:qwen3-rerank}
  # 阿里云 DocumentMind：pdf/docx/png 的唯一解析路径（不降级）。
  # 密钥与环境变量同名，也可直接填进 application-local.yml（不提交）
  docmind:
    access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
    access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
    region-id: ${DOCMIND_REGION:cn-hangzhou}
    endpoint: ${DOCMIND_ENDPOINT:docmind-api.cn-hangzhou.aliyuncs.com}
